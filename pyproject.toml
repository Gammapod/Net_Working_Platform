[project]
name = "net-working-platform"
version = "0.1.0"
description = "Graph-backed representative-agent communication MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
]

[project.scripts]
net-working-platform = "net_working_platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
